version: "3.8"
services:
  stalwart:
    image: stalwartlabs/stalwart:latest-alpine # for production choose specific version from https://hub.docker.com/r/stalwartlabs/stalwart/tags
    ports:
      - "25:25"       # SMTP entrante
      - "465:465"     # SMTPS
      - "587:587"     # Submission con STARTTLS
      - "993:993"     # IMAPS
      - "995:995"     # POP3S
      - "4190:4190"   # ManageSieve, opcional
      - "143:143"     # IMAP legacy, solo si necesitas STARTTLS
      - "110:110"     # POP3 legacy, solo si necesitas STARTTLS
    expose:
      - "8080"        # API/UI HTTP interna para Traefik
    volumes:
      - stalwart_data:/opt/stalwart-mail
    restart: unless-stopped

volumes:
  stalwart_data: