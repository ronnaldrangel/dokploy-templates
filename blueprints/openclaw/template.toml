[variables]
gateway_token = "${password:32}"

[config]
[[config.domains]]
  serviceName = "openclaw"
  port = 8080
  host = "${domain}"

[config.env]
# Identity & Auth
OPENCLAW_GATEWAY_TOKEN = "${gateway_token}"
OPENCLAW_GATEWAY_PORT = 18789
OPENCLAW_ALLOWED_ORIGINS = "*"

# AI Providers
OPENROUTER_API_KEY = "YOUR-API-KEY"

# Network
OPENCLAW_BRIDGE_PORT = 18790
OPENCLAW_GATEWAY_BIND = "lan"

# Extensions & Plugins
OPENCLAW_PLUGINS = "discord,memory-core"

# System Config (Disable Pairing & Allow All Proxies)
OPENCLAW_CONFIG_JSON = '{"gateway":{"controlUi":{"allowInsecureAuth":true,"dangerouslyDisableDeviceAuth":true},"trustedProxies":["0.0.0.0/0","::/0"],"nodes":{"allowCommands":["system.notify","system.run","system.run.prepare","system.which","system.execApprovals.get","system.execApprovals.set","canvas.present","canvas.hide","canvas.navigate","canvas.eval","canvas.snapshot","canvas.a2ui.push","canvas.a2ui.reset","screen.capture","screen.list","camera.list","camera.snap"]}}}'