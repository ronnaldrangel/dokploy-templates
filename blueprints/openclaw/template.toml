[variables]
gateway_token = "${password:32}"
auth_username = "dokploy"
auth_password = "${password:32}"

[config]
[[config.domains]]
  serviceName = "openclaw"
  port = 8080
  host = "${domain}"
  certificate = true

[config.env]
# Identity & Auth
OPENCLAW_GATEWAY_TOKEN = "${gateway_token}"
OPENCLAW_GATEWAY_PORT = 18789
AUTH_USERNAME = "${auth_username}"
AUTH_PASSWORD = "${auth_password}"
OPENCLAW_ALLOWED_ORIGINS = "https://${domain},http://${domain}"

# Network
OPENCLAW_BRIDGE_PORT = 18790
OPENCLAW_GATEWAY_BIND = "lan"
OPENCLAW_DOMAIN = "${domain}"

# AI Providers
OPENROUTER_API_KEY = "YOUR-API-KEY"

# Extensions & Plugins
OPENCLAW_PLUGINS = "discord,memory-core"

# Browser Settings
BROWSER_DEFAULT_PROFILE = "openclaw"
BROWSER_EVALUATE_ENABLED = "true"
BROWSER_SNAPSHOT_MODE = "efficient"
BROWSER_REMOTE_TIMEOUT_MS = "1500"
BROWSER_REMOTE_HANDSHAKE_TIMEOUT_MS = "3000"

# System
OPENCLAW_TZ = "UTC"
