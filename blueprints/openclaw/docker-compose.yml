version: "3.8"
services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    restart: always
    user: root
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_ALLOW_INSECURE_PRIVATE_WS=${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      - OPENCLAW_ALLOW_UNCONFIGURED=${OPENCLAW_ALLOW_UNCONFIGURED:-true}
      - OPENCLAW_GATEWAY_MODE=${OPENCLAW_GATEWAY_MODE:-local}
      - OPENCLAW_GATEWAY_CONTROL_UI_DANGEROUSLY_ALLOW_HOST_HEADER_ORIGIN_FALLBACK=${OPENCLAW_GATEWAY_CONTROL_UI_DANGEROUSLY_ALLOW_HOST_HEADER_ORIGIN_FALLBACK:-}
      - CLAUDE_AI_SESSION_KEY=${CLAUDE_AI_SESSION_KEY:-}
      - CLAUDE_WEB_SESSION_KEY=${CLAUDE_WEB_SESSION_KEY:-}
      - CLAUDE_WEB_COOKIE=${CLAUDE_WEB_COOKIE:-}
      - TZ=${OPENCLAW_TZ:-UTC}
    volumes:
      - openclaw-config:/home/node/.openclaw
      - openclaw-workspace:/home/node/.openclaw/workspace
    # No se requiere 'ports' ni 'expose' explícito; Traefik redirige al puerto 18789 configurado en el template.toml
    command:
      - sh
      - -c
      - |
        chown -R 1000:1000 /home/node/.openclaw && \
        exec node dist/index.js gateway --bind lan --port 18789 --allow-unconfigured
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  openclaw-config:
  openclaw-workspace:

